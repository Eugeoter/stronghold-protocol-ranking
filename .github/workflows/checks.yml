name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.txt -r requirements-prod.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node tests/test_frontend.cjs
      - name: Verify production server and health
        run: |
          gunicorn --config gunicorn.conf.py app:app &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:10000/healthz > /dev/null; then
              curl --fail --silent http://127.0.0.1:10000/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          exit 1
